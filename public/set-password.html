<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Set your password · CompassIQ</title>
<link rel="stylesheet" href="/assets/ciq.css">
</head>
<body>
<main class="center">
  <div class="card">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="22" stroke="currentColor" stroke-width="2.6"/><path d="M28 10 L34 28 L28 25 L22 28 Z" fill="#7c5cff"/><path d="M28 46 L34 28 L28 31 L22 28 Z" fill="currentColor" opacity=".35"/></svg>
      <span>Compass<em>IQ</em></span>
    </div>
    <p class="muted" id="checking">Checking your link…</p>

    <form id="form" novalidate hidden>
      <h1 id="title">Set your password</h1>
      <p class="muted small" id="who"></p>
      <label for="pw">New password</label>
      <input type="password" id="pw" autocomplete="new-password" minlength="10" required>
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="10" required>
      <p class="muted small" style="margin-top:8px;">At least 10 characters.</p>
      <button class="btn block" id="go" type="submit">Save and continue</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>

    <div id="bad" hidden>
      <h1>This link has expired</h1>
      <p class="muted" id="bad-why">Invite and reset links work once and expire after a while.</p>
      <a class="btn block" href="/">Go to sign in</a>
      <p class="muted small" style="margin-top:12px;">On the sign-in page, choose “Forgot your password?” for a new link, or ask your company admin to resend your invite.</p>
    </div>
  </div>
</main>
<script src="/assets/ciq-page.js"></script>
<script>
(function () {
  'use strict';
  const { api, showMsg } = window.CIQ;
  const $ = (id) => document.getElementById(id);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  // Keep the tokens out of history and out of anything the page loads next
  history.replaceState(null, '', location.pathname);

  function bad(why) {
    $('checking').hidden = true; $('form').hidden = true; $('bad').hidden = false;
    if (why) $('bad-why').textContent = why;
  }
  function ready(me, type) {
    $('checking').hidden = true; $('form').hidden = false;
    $('title').textContent = type === 'invite' ? 'Welcome — set your password' : 'Set a new password';
    $('who').textContent = me.email + (me.access && me.access.org ? ' · ' + me.access.org.name : '');
    $('pw').focus();
  }

  (async function start() {
    try {
      if (hash.get('error') || hash.get('error_description')) return bad(hash.get('error_description') || undefined);
      if (hash.get('access_token') && hash.get('refresh_token')) {
        await api('/api/session', { method: 'POST', body: {
          access_token: hash.get('access_token'), refresh_token: hash.get('refresh_token'), expires_in: Number(hash.get('expires_in')) || 3600 } });
      }
      const me = await api('/api/session');   // also works for a signed-in person changing their password
      ready(me, hash.get('type'));
    } catch (e) {
      bad(e.status === 401 ? undefined : e.message);
    }
  })();

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value, pw2 = $('pw2').value;
    if (pw.length < 10) return showMsg($('msg'), 'Use at least 10 characters.');
    if (pw !== pw2) return showMsg($('msg'), 'The passwords don’t match.');
    $('go').disabled = true;
    try {
      await api('/api/session', { method: 'POST', body: { action: 'password', password: pw } });
      const me = await api('/api/session');
      location.replace(me.home || '/app');
    } catch (err) {
      showMsg($('msg'), err.message);
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
